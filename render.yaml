services:
  - type: web
    name: playground-backend
    env: node
    plan: free
    buildCommand: pnpm install --no-frozen-lockfile && pnpm prisma generate
    startCommand: pnpm server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
